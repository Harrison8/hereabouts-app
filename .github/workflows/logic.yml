# Checks the phone apps' logic against the website's own answers, in shared/bundle/expected/. The swift job runs the
# iPhone app's logic tests (the Swift package ios/HereaboutsCore); the kotlin job runs the Android app's logic tests
# (the Gradle module android/core). The bundle is already in this project: every snapshot carries it.
# Runs on every snapshot pushed here (main and pr/<number>) and by hand. Never on outside contributions.
name: App logic

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the run still going for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swift:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: swift:6.2
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: swift test
        working-directory: ios/HereaboutsCore
        run: swift test

  kotlin:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Refuses a gradle-wrapper.jar that is not one Gradle published, before anything runs it.
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/*.kts
            android/core/*.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties
      - name: gradle test
        working-directory: android
        run: ./gradlew :core:test --no-daemon
