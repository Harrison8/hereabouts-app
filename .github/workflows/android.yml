# The Android app: it is built and linted, then its tests run on two emulators, the newest Android (API 36) and the
# oldest the app supports (API 26), with a screenshot of each tab saved for review. The bundle is already in this
# project: every snapshot carries it. Nothing is signed here: Debug builds need no signing.
# Runs on every snapshot pushed here (main and pr/<number>) and by hand. Never on outside contributions.
name: Android app

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the run still going for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Refuses a gradle-wrapper.jar that is not one Gradle published, before anything runs it.
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/*.kts
            android/*/*.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Build the Debug app and lint it
        working-directory: android
        run: ./gradlew :app:assembleDebug :app:lintDebug --no-daemon

      # The app must never ask for exact alarms: Google Play allows them only for alarm clocks and calendars.
      - name: no-exact-alarm (the merged manifest must not ask for exact alarms)
        run: |
          merged=$(find android/app/build/intermediates -name AndroidManifest.xml -path '*merged_manifest*' | head -n 1)
          echo "Merged manifest: $merged"
          test -n "$merged"
          if grep -n EXACT_ALARM "$merged"; then
            echo "FAIL no-exact-alarm"
            exit 1
          fi
          echo "PASS no-exact-alarm"

      # The app must carry the data, tables and photos, and never the expected answers, which only the logic tests read.
      - name: Check what the app carries
        run: |
          set -euo pipefail
          apk=android/app/build/outputs/apk/debug/app-debug.apk
          unzip -l "$apk" > "$RUNNER_TEMP/apk.txt"
          for d in data tables images; do
            grep -q " assets/$d/" "$RUNNER_TEMP/apk.txt" || { echo "::error::The app has no assets/$d folder."; exit 1; }
          done
          for f in res/font/young_serif.ttf res/font/figtree.ttf; do
            grep -q " $f\$" "$RUNNER_TEMP/apk.txt" || { echo "::error::The app has no $f."; exit 1; }
          done
          if grep -q " assets/expected/" "$RUNNER_TEMP/apk.txt"; then
            echo "::error::The app carries assets/expected, which only the logic tests need."
            exit 1
          fi
          ls -l "$apk"

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-lint
          path: android/app/build/reports/lint-results-debug.*
          if-no-files-found: warn

  emulator:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        api: [36, 26]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: gradle/actions/wrapper-validation@v6
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle
          cache-dependency-path: |
            android/*.kts
            android/*/*.kts
            android/gradle/libs.versions.toml
            android/gradle/wrapper/gradle-wrapper.properties

      - name: Free disk space (the emulator needs about 7 GB for its data partition)
        run: |
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/share/boost /opt/hostedtoolcache/CodeQL
          df -h /
      - name: Let the emulator use hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The emulator runner runs each script line on its own, so the tests, the screenshot copy and the exit code
      # share one line: the screenshots are copied even when a test fails, and the step still fails then.
      - name: Run the app's tests on the emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: google_apis
          arch: x86_64
          disk-size: 4096M
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -no-metrics
          disable-animations: true
          working-directory: android
          script: ./gradlew :app:connectedDebugAndroidTest --no-daemon; s=$?; mkdir -p "$RUNNER_TEMP/screenshots"; adb pull /data/local/tmp/hereabouts-screenshots/. "$RUNNER_TEMP/screenshots/" || true; exit $s

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-screenshots-api-${{ matrix.api }}
          path: ${{ runner.temp }}/screenshots/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: android-test-results-api-${{ matrix.api }}
          path: android/app/build/reports/androidTests/
          if-no-files-found: warn
