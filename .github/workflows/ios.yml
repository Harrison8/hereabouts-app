# The iPhone app: its logic tests, then the app and its screen tests on the iPhone simulator, with a screenshot of
# each screen saved for review. XcodeGen makes the Xcode project from ios/project.yml first, so no Xcode project file
# is kept in git. Nothing is signed here: simulator builds need no signing.
# Runs on every snapshot pushed here (main and pr/<number>) and by hand. Never on outside contributions.
name: iPhone app

on:
  push:
  workflow_dispatch:
    inputs:
      run:
        description: Which by-hand job to run
        type: choice
        default: release-check
        options:
          - ios17
          - release-check
          - store-screenshots
          - testflight

permissions:
  contents: read

# A new push to the same branch cancels the run still going for the old one.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.run || 'push' }}
  cancel-in-progress: true

jobs:
  app:
    # Only on a push. A by-hand run starts just the job chosen in the run input.
    if: ${{ github.event_name == 'push' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      # Build output, test results and screenshots go outside the checkout.
      - name: Work folders
        run: |
          {
            echo "DERIVED=$RUNNER_TEMP/derived"
            echo "RESULTS=$RUNNER_TEMP/results"
            echo "SHOTS=$RUNNER_TEMP/screenshots"
          } >> "$GITHUB_ENV"

      - name: Xcode and simulators on this machine
        run: |
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devices available

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: swift test
        working-directory: ios/HereaboutsCore
        run: swift test

      - name: Make the Xcode project
        working-directory: ios
        run: xcodegen

      - name: Build the app and its tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build-for-testing -quiet \
            -project Hereabouts.xcodeproj -scheme Hereabouts \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO

      # The app must carry the data, tables, photos and fonts, and never the expected answers, which only the tests read.
      - name: Check what the app carries
        run: |
          set -euo pipefail
          app="$DERIVED/Build/Products/Debug-iphonesimulator/Hereabouts.app"
          for d in data tables images fonts; do
            test -d "$app/bundle/$d" || { echo "::error::The app has no bundle/$d folder."; exit 1; }
          done
          if [ -e "$app/bundle/expected" ]; then
            echo "::error::The app carries bundle/expected, which only the tests need."
            exit 1
          fi
          ls "$app" "$app/bundle"
          du -sh "$app"

      # What the app ships must stay under 95 MB: the data, tables, photos and fonts in bundle/. The whole Debug app
      # is not measured, because its test-only code makes it bigger than the shipped app.
      - name: Check the shipped content stays under 95 MB
        run: |
          set -euo pipefail
          bundle="$DERIVED/Build/Products/Debug-iphonesimulator/Hereabouts.app/bundle"
          limit=95000000
          for d in data tables images fonts; do
            echo "bundle/$d: $(find "$bundle/$d" -type f -exec stat -f %z {} + | awk '{s+=$1} END {print s+0}') bytes"
          done
          total=$(find "$bundle" -type f -exec stat -f %z {} + | awk '{s+=$1} END {print s+0}')
          echo "bundle/ holds $total bytes. The limit is $limit."
          echo "- Shipped content: $total bytes of $limit" >> "$GITHUB_STEP_SUMMARY"
          if [ "$total" -gt "$limit" ]; then
            echo "::error::The shipped content is $total bytes, over the 95 MB limit ($limit bytes)."
            exit 1
          fi

      # The simulators this machine has, for the two test steps. Runtime versions are compared as numbers, so 26.10
      # comes after 26.2.
      - name: List the simulators as JSON
        run: |
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/runtimes.json"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"

      # iPhone 17 on the newest iOS 26 the machine has.
      - name: Screen tests on iOS 26
        working-directory: ios
        run: |
          set -euo pipefail
          udid=$(jq -rn --slurpfile rt "$RUNNER_TEMP/runtimes.json" --slurpfile dv "$RUNNER_TEMP/devices.json" '
            [$rt[0].runtimes[] | select(.platform == "iOS" and .isAvailable and (.version | startswith("26.")))]
              | sort_by(.version | split(".") | map(tonumber))
              | map(.identifier as $id | ($dv[0].devices[$id] // [])[] | select(.name == "iPhone 17") | .udid)
              | last // empty')
          if [ -z "$udid" ]; then
            echo "::error::No iPhone 17 simulator on iOS 26 on this machine."
            exit 1
          fi
          echo "Testing on iPhone 17 ($udid)."
          echo "UDID=$udid" >> "$GITHUB_ENV"
          echo "- iPhone 17, iOS 26: ran" >> "$GITHUB_STEP_SUMMARY"
          # "Use my location" is allowed before the tests start, so the screen test never waits on the phone's own
          # permission question, which the test machine is slow to show.
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl install "$udid" "$DERIVED/Build/Products/Debug-iphonesimulator/Hereabouts.app"
          xcrun simctl privacy "$udid" grant location garden.hereabouts.app || true
          xcodebuild test-without-building \
            -project Hereabouts.xcodeproj -scheme Hereabouts \
            -destination "platform=iOS Simulator,id=$udid,arch=arm64" \
            -derivedDataPath "$DERIVED" \
            -skip-testing:HereaboutsUITests/StoreScreenshotTests \
            -resultBundlePath "$RESULTS/ios26.xcresult"

      # Every screenshot the screen tests attached, named by run and screen, from each result.
      - name: Take the screenshots out of the results
        if: always()
        run: |
          set -uo pipefail
          mkdir -p "$SHOTS"
          for r in "$RESULTS"/*.xcresult; do
            [ -e "$r" ] || continue
            run=$(basename "$r" .xcresult)
            out="$SHOTS/$run"
            mkdir -p "$out"
            xcrun xcresulttool export attachments --path "$r" --output-path "$out" || continue
            if [ -f "$out/manifest.json" ]; then
              jq -r '.[] | .attachments[]? | [.exportedFileName, .suggestedHumanReadableName] | @tsv' "$out/manifest.json" |
                while IFS=$'\t' read -r file nice; do
                  # The upload refuses names with " : < > | * ? in them, which a failed test's notes carry.
                  nice=$(printf '%s' "$nice" | tr '":<>|*?' '_______')
                  [ -n "$file" ] && [ -n "$nice" ] && [ -f "$out/$file" ] && mv "$out/$file" "$out/$run-$nice"
                done
            fi
          done
          find "$SHOTS" -type f | sort

      - name: Save the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iphone-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
          retention-days: 14

      # The app's own log from the iPhone 17 simulator: what the app wrote while the screen tests ran, which the test
      # output does not carry.
      - name: Take the app's log from the simulator
        if: always()
        run: |
          set -uo pipefail
          mkdir -p "$RUNNER_TEMP/applog"
          if [ -z "${UDID:-}" ]; then echo "No simulator was used."; exit 0; fi
          xcrun simctl spawn "$UDID" log show --last 90m --info --style compact \
            --predicate 'process == "Hereabouts"' > "$RUNNER_TEMP/applog/hereabouts.log" 2>&1 || true
          wc -l "$RUNNER_TEMP/applog/"*
          gzip -f "$RUNNER_TEMP/applog/hereabouts.log"

      - name: Save the app's log
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iphone-app-log
          path: ${{ runner.temp }}/applog
          if-no-files-found: warn
          retention-days: 14

  # The lowest iOS the app supports. No build machine has an iOS 17 simulator, so this job downloads iOS 17.5 (several
  # GB) and runs the unit tests and the whole screen test suite on it, with a screenshot of each screen. It runs only
  # when chosen by hand, never on a push.
  ios17:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'ios17' }}
    runs-on: macos-26
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Work folders
        run: |
          {
            echo "DERIVED=$RUNNER_TEMP/derived"
            echo "RESULTS=$RUNNER_TEMP/results"
            echo "SHOTS=$RUNNER_TEMP/screenshots"
          } >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Make the Xcode project
        working-directory: ios
        run: xcodegen

      - name: Download the iOS 17.5 simulator
        run: |
          set -euo pipefail
          xcodebuild -version
          # "Unable to connect to simulator" means the simulator service had not started yet. Wake it, then try up to 3 times.
          xcrun simctl list runtimes > /dev/null || true
          ok=0
          for attempt in 1 2 3; do
            if xcodebuild -downloadPlatform iOS -buildVersion 17.5; then ok=1; break; fi
            echo "Download attempt $attempt failed"
            sleep 30
            xcrun simctl list runtimes > /dev/null || true
          done
          [ "$ok" = 1 ]
          xcrun simctl list runtimes

      - name: Build the app and its tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build-for-testing -quiet \
            -project Hereabouts.xcodeproj -scheme Hereabouts \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO

      - name: Unit tests and screen tests on iOS 17.5
        working-directory: ios
        run: |
          set -euo pipefail
          runtime=$(xcrun simctl list runtimes -j | jq -r '
            [.runtimes[] | select(.platform == "iOS" and .isAvailable and .version == "17.5")] | first | .identifier // empty')
          if [ -z "$runtime" ]; then
            echo "::error::The iOS 17.5 simulator did not install."
            exit 1
          fi
          # An iPhone 15 runs iOS 17; newer models do not.
          udid=$(xcrun simctl create "iPhone 15 (iOS 17.5)" com.apple.CoreSimulator.SimDeviceType.iPhone-15 "$runtime")
          echo "Testing on iPhone 15, iOS 17.5 ($udid)."
          echo "- iPhone 15, iOS 17.5: ran" >> "$GITHUB_STEP_SUMMARY"
          xcrun simctl boot "$udid" 2>/dev/null || true
          xcrun simctl install "$udid" "$DERIVED/Build/Products/Debug-iphonesimulator/Hereabouts.app"
          xcrun simctl privacy "$udid" grant location garden.hereabouts.app || true
          xcodebuild test-without-building \
            -project Hereabouts.xcodeproj -scheme Hereabouts \
            -destination "platform=iOS Simulator,id=$udid,arch=arm64" \
            -derivedDataPath "$DERIVED" \
            -skip-testing:HereaboutsUITests/StoreScreenshotTests \
            -resultBundlePath "$RESULTS/ios17.xcresult"

      # Every screenshot and audit note the screen tests attached, named by run and screen.
      - name: Take the screenshots out of the results
        if: always()
        run: |
          set -uo pipefail
          mkdir -p "$SHOTS"
          for r in "$RESULTS"/*.xcresult; do
            [ -e "$r" ] || continue
            run=$(basename "$r" .xcresult)
            out="$SHOTS/$run"
            mkdir -p "$out"
            xcrun xcresulttool export attachments --path "$r" --output-path "$out" || continue
            if [ -f "$out/manifest.json" ]; then
              jq -r '.[] | .attachments[]? | [.exportedFileName, .suggestedHumanReadableName] | @tsv' "$out/manifest.json" |
                while IFS=$'	' read -r file nice; do
                  nice=$(printf '%s' "$nice" | tr '":<>|*?' '_______')
                  [ -n "$file" ] && [ -n "$nice" ] && [ -f "$out/$file" ] && mv "$out/$file" "$out/$run-$nice"
                done
            fi
          done
          find "$SHOTS" -type f | sort

      - name: Save the screenshots
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: iphone-ios17-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: warn
          retention-days: 14

  # A Release build with no signing, to see what the store would receive: the app's size, the privacy manifest inside
  # it, its version numbers and the encryption answer. Nothing is uploaded. Runs only when chosen by hand.
  release-check:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'release-check' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Make the Xcode project
        working-directory: ios
        run: xcodegen

      - name: Archive the app in Release
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild archive -quiet \
            -project Hereabouts.xcodeproj -scheme Hereabouts \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Hereabouts.xcarchive" \
            CODE_SIGNING_ALLOWED=NO

      - name: Check what the store would receive
        run: |
          set -euo pipefail
          app="$RUNNER_TEMP/Hereabouts.xcarchive/Products/Applications/Hereabouts.app"
          test -d "$app" || { echo "::error::The archive holds no Hereabouts.app."; exit 1; }
          plist() { /usr/libexec/PlistBuddy -c "Print :$1" "$app/Info.plist"; }
          size=$(du -sh "$app" | cut -f1)
          version=$(plist CFBundleShortVersionString)
          build=$(plist CFBundleVersion)
          encryption=$(plist ITSAppUsesNonExemptEncryption)
          {
            echo "### Release check"
            echo "- App size: $size"
            echo "- Version: $version, build $build"
            echo "- ITSAppUsesNonExemptEncryption: $encryption"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$app/PrivacyInfo.xcprivacy" ]; then
            echo "- PrivacyInfo.xcprivacy: inside the app" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "- PrivacyInfo.xcprivacy: MISSING" >> "$GITHUB_STEP_SUMMARY"
            echo "::error::PrivacyInfo.xcprivacy is not inside the app."
            exit 1
          fi
          if [ "$encryption" != "false" ]; then
            echo "::error::ITSAppUsesNonExemptEncryption is $encryption, not false."
            exit 1
          fi
          du -sh "$app"
          ls "$app"

  # The pictures for the App Store listing: one walk through the app, photographed on two phone sizes with a clean
  # status bar. Runs only when chosen by hand.
  store-screenshots:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'store-screenshots' }}
    runs-on: macos-26
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Work folders
        run: |
          {
            echo "DERIVED=$RUNNER_TEMP/derived"
            echo "RESULTS=$RUNNER_TEMP/results"
            echo "SHOTS=$RUNNER_TEMP/store-shots"
          } >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Make the Xcode project
        working-directory: ios
        run: xcodegen

      - name: Build the app and its tests
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild build-for-testing -quiet \
            -project Hereabouts.xcodeproj -scheme Hereabouts \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath "$DERIVED" \
            CODE_SIGNING_ALLOWED=NO

      - name: List the simulators as JSON
        run: |
          xcrun simctl list runtimes -j > "$RUNNER_TEMP/runtimes.json"
          xcrun simctl list devices available -j > "$RUNNER_TEMP/devices.json"

      # The screenshot test on the iPhone 17 Pro Max and the iPhone 17, each on the newest iOS 26 the machine has.
      # Each phone's status bar shows 9:41, full battery and full signal first.
      - name: Take the pictures on two phones
        working-directory: ios
        run: |
          set -euo pipefail
          udid_of() {
            jq -rn --arg name "$1" --slurpfile rt "$RUNNER_TEMP/runtimes.json" --slurpfile dv "$RUNNER_TEMP/devices.json" '
              [$rt[0].runtimes[] | select(.platform == "iOS" and .isAvailable and (.version | startswith("26.")))]
                | sort_by(.version | split(".") | map(tonumber))
                | map(.identifier as $id | ($dv[0].devices[$id] // [])[] | select(.name == $name) | .udid)
                | last // empty'
          }
          mkdir -p "$RESULTS"
          for pair in "iphone-17-pro-max:iPhone 17 Pro Max" "iphone-17:iPhone 17"; do
            slug="${pair%%:*}"
            name="${pair#*:}"
            udid=$(udid_of "$name")
            if [ -z "$udid" ]; then
              echo "::error::No $name simulator on iOS 26 on this machine."
              exit 1
            fi
            echo "Photographing on $name ($udid)."
            xcrun simctl boot "$udid" 2>/dev/null || true
            xcrun simctl bootstatus "$udid" -b
            xcrun simctl status_bar "$udid" override --time 9:41 --dataNetwork wifi --wifiBars 3 \
              --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
            xcrun simctl install "$udid" "$DERIVED/Build/Products/Debug-iphonesimulator/Hereabouts.app"
            xcrun simctl privacy "$udid" grant location garden.hereabouts.app || true
            xcodebuild test-without-building \
              -project Hereabouts.xcodeproj -scheme Hereabouts \
              -destination "platform=iOS Simulator,id=$udid,arch=arm64" \
              -derivedDataPath "$DERIVED" \
              -only-testing:HereaboutsUITests/StoreScreenshotTests \
              -resultBundlePath "$RESULTS/$slug.xcresult"
          done

      # The pictures the test attached, named <phone>-<number>-<screen>.png. The store refuses pictures with an alpha
      # (see-through) channel, so any that has one is flattened by saving it as a high-quality JPEG.
      - name: Take the pictures out of the results
        if: always()
        run: |
          set -uo pipefail
          mkdir -p "$SHOTS"
          for r in "$RESULTS"/*.xcresult; do
            [ -e "$r" ] || continue
            slug=$(basename "$r" .xcresult)
            out="$RUNNER_TEMP/export-$slug"
            mkdir -p "$out"
            xcrun xcresulttool export attachments --path "$r" --output-path "$out" || continue
            [ -f "$out/manifest.json" ] || continue
            jq -r '.[] | .attachments[]? | select(.suggestedHumanReadableName | startswith("store-")) | [.exportedFileName, .suggestedHumanReadableName] | @tsv' "$out/manifest.json" |
              while IFS=$'\t' read -r file nice; do
                base="${nice%.*}"
                base=$(printf '%s' "$base" | sed -E 's/_[0-9]+_[0-9A-Fa-f-]{36}$//; s/^store-//')
                [ -n "$file" ] && [ -n "$base" ] && [ -f "$out/$file" ] && mv "$out/$file" "$SHOTS/$slug-$base.png"
              done
          done
          {
            echo "### Store screenshots"
            echo "| File | Pixels | Alpha |"
            echo "| --- | --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"
          for f in "$SHOTS"/*.png; do
            [ -e "$f" ] || continue
            alpha=$(sips -g hasAlpha "$f" | awk '/hasAlpha/ {print $2}')
            if [ "$alpha" = "yes" ]; then
              jpg="${f%.png}.jpg"
              sips -s format jpeg -s formatOptions 100 "$f" --out "$jpg" > /dev/null
              rm -f "$f"
              f="$jpg"
              alpha="flattened to JPEG"
            fi
            w=$(sips -g pixelWidth "$f" | awk '/pixelWidth/ {print $2}')
            h=$(sips -g pixelHeight "$f" | awk '/pixelHeight/ {print $2}')
            echo "| $(basename "$f") | ${w}x${h} | $alpha |" >> "$GITHUB_STEP_SUMMARY"
          done
          find "$SHOTS" -type f | sort

      - name: Save the pictures
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: store-screenshots
          path: ${{ runner.temp }}/store-shots
          if-no-files-found: warn
          retention-days: 14

  # Builds the signed Release app and uploads it to App Store Connect for TestFlight, with the founder's App Store
  # Connect key kept in this project's secrets. The build number is this run's number. Runs only when chosen by hand,
  # and only from main or a snapshot of a pull request, never from another branch.
  testflight:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.run == 'testflight' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/heads/pr/')) }}
    runs-on: macos-26
    timeout-minutes: 90
    env:
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check the four secrets are saved
        run: |
          missing=""
          for name in APPLE_API_KEY_ID APPLE_API_ISSUER_ID APPLE_TEAM_ID APPLE_API_KEY_P8; do
            [ -n "${!name:-}" ] || missing="$missing $name"
          done
          if [ -n "$missing" ]; then
            echo "::error::These secrets are not saved in this project:$missing. Save them as the Apple setup steps say, then run this again."
            exit 1
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Make the Xcode project
        working-directory: ios
        run: xcodegen

      # The key goes to the folder xcodebuild looks in, and is never printed. The last step removes it.
      - name: Save the App Store Connect key for this job
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$RUNNER_TEMP/private_keys"
          printf '%s\n' "$APPLE_API_KEY_P8" | tr -d '\r' > "$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
          echo "KEY_PATH=$RUNNER_TEMP/private_keys/AuthKey_${APPLE_API_KEY_ID}.p8" >> "$GITHUB_ENV"

      # Automatic signing at archive time may need a development profile, which Apple can refuse to make for a team
      # with no registered phone. No Apple page read on 2026-11-23 settles it, so the job tries both routes: first a
      # signed archive, and if that fails an unsigned one, which the export step below signs for the App Store.
      - name: Archive the app
        working-directory: ios
        run: |
          set -o pipefail
          common=(-project Hereabouts.xcodeproj -scheme Hereabouts -configuration Release
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Hereabouts.xcarchive"
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION=${{ github.run_number }})
          if xcodebuild archive -quiet "${common[@]}" CODE_SIGN_STYLE=Automatic \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$KEY_PATH" \
              -authenticationKeyID "$APPLE_API_KEY_ID" \
              -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"; then
            echo "- Archive: signed with automatic signing" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::The signed archive failed. Trying an unsigned archive for the export step to sign."
            rm -rf "$RUNNER_TEMP/Hereabouts.xcarchive"
            xcodebuild archive -quiet "${common[@]}" CODE_SIGNING_ALLOWED=NO
            echo "- Archive: unsigned, signed at export" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Export and upload to App Store Connect
        working-directory: ios
        run: |
          set -o pipefail
          {
            echo '<?xml version="1.0" encoding="UTF-8"?>'
            echo '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">'
            echo '<plist version="1.0"><dict>'
            echo '<key>method</key><string>app-store-connect</string>'
            echo '<key>destination</key><string>upload</string>'
            echo "<key>teamID</key><string>$APPLE_TEAM_ID</string>"
            echo '<key>signingStyle</key><string>automatic</string>'
            echo '</dict></plist>'
          } > "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive -quiet \
            -archivePath "$RUNNER_TEMP/Hereabouts.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$APPLE_API_KEY_ID" \
            -authenticationKeyIssuerID "$APPLE_API_ISSUER_ID"
          echo "- Uploaded build ${{ github.run_number }} to App Store Connect. It shows under TestFlight after Apple's processing." >> "$GITHUB_STEP_SUMMARY"

      - name: Delete the key file
        if: always()
        run: rm -rf "$RUNNER_TEMP/private_keys"
